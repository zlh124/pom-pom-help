    options:
      - 我方全体速度提高 20%
      - 我方全体攻击力提高 20%
      - 立即回复生命值
    answer: 0
    explanation: 使用后下一场战斗随机生效一个效果，「仓鼠球骑士风味」为速度提高 20%。
