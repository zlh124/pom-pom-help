questions:
  - id: q1
    difficulty: easy
    question: 仙舟「曜青」的椒丘，称号是什么？
    options:
      - 医中名厨
      - 云骑将军
      - 无罅飞光
    answer: 0
    explanation: 椒丘是曜青的狐人医士、策士，称号「医中名厨」，主张医食同源。
    tags:
      - 角色
      - 椒丘
    sources:
      - https://wiki.biligame.com/sr/椒丘
  - id: q2
    difficulty: easy
    question: 版本活动「黄金迷境大饭店」发生在哪个地区？
    options:
      - 翁法罗斯
      - 匹诺康尼
      - 仙舟「罗浮」
    answer: 0
    explanation: 活动页面标注所属地区为翁法罗斯，并建议先完成「翁法罗斯」开拓任务再体验。
    tags:
      - 活动
      - 世界观
    sources:
      - https://wiki.biligame.com/sr/「黄金迷境大饭店」
  - id: q3
