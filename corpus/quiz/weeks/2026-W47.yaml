    question: 帕姆在星穹列车上的身份是？
    options:
      - 列车长
      - 领航员
      - 乘客
    answer: 0
    explanation: 帕姆是星穹列车的列车长，负责车厢日常与乘客起居；领航员是姬子。
    tags:
      - 帕姆
      - 列车
    sources:
      - https://wiki.biligame.com/sr/帕姆
