body: |
  ## 定位
  量子虚无副C：植入属性弱点（优先匹配队伍首位角色属性）、降低敌方防御，并随机施加攻击/防御/速度缺陷。

  ## 遗器
  外圈「繁星璀璨的天才」4 件（官方使用率快照最高）；内圈「泛银河商业公司」2 件。
  主词条效果命中衣、速度鞋、量子球、充能绳；副词条效果命中 > 速度 > 双暴。

  ## 光锥
  专武「雨一直下」；四星毕业「新手任务开始前」；过渡「决心如汗珠般闪耀」。

  ## 置信度说明
  BWIKI「银狼/攻略」页为空模板。套装来自官方遗器使用率统计快照（2024-12-09），
  可能滞后于 4.7 版本；4.7 版本有「加强」条目，请以当前技能为准。
