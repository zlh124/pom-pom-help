body: |
  ## 定位
  冰同谐辅助：提高全队弱点击破效率、速度与全属性抗性穿透；队友击破弱点时还能追加击破伤害。

  ## 遗器
  外圈「流星追迹的怪盗」4 件（官方使用率快照最高）；内圈「生命的翁瓦克」2 件。
  主词条生命衣、速度鞋、生命/击破球、击破绳；副词条击破特攻 > 速度 > 生命。

  ## 光锥
  专武「镜中故我」；四星「记忆中的模样」；需要拉条可用「舞！舞！舞！」。

  ## 置信度说明
  BWIKI「阮•梅/攻略」页为空模板。套装来自官方遗器使用率统计快照（2024-12-09），
  可能滞后于 4.7 版本；击破特攻档位以当前技能说明为准。
