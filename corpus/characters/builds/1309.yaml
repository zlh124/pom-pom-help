body: |
  ## 定位
  物理同谐辅助，追击队拐力最强，非追击队也是强力群辅。终结技让全队立即行动，
  但需要先排好速度轴与充能轴，比较吃操作理解。

  ## 遗器
  2+2 攻击套（幽锁深牢的系囚 / 野穗伴行的快枪手 / 风举云飞的勇烈 / 凯歌祝捷的英豪任选其二），
  内圈「生命的翁瓦克」。主词条攻击衣、攻击鞋、攻击球、充能绳；副词条速度 > 攻击 > 生存。

  ## 光锥
  专武「夜色流光溢彩」；常驻「但战斗还未结束」；四星「镂月裁云之意」。

  ## 注意
  终结技期间免疫控制类负面效果，效果抵抗与双暴词条不重要；全队行动后立刻开大收益最高。
