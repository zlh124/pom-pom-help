body: |
  ## 定位
  量子存护：替全队分摊伤害、降低我方受到的伤害并提高暴击率；生命值低于一定比例时回复自身生命。

  ## 遗器
  外圈「宝命长存的莳者」4 件（快照中常以 2+2 出现）；内圈「折断的龙骨」2 件。
  主词条生命衣、速度鞋、生命球、充能/生命绳；副词条速度 > 生命 > 效果抵抗。

  ## 光锥
  专武「她已闭上双眼」；四星「朗道的选择」「余生的第一天」。

  ## 置信度说明
  BWIKI「符玄/攻略」页为空模板。套装来自官方遗器使用率统计快照（2024-12-09），
  可能滞后于 4.7 版本。符玄更适合长线作战。
