body: |
  ## 定位
  火属性毁灭主C，超击破体系核心。只有在敌人处于「弱点击破」窗口期才能触发超击破伤害，
  所以速度、击破特攻、削韧比攻击力更重要。

  ## 遗器
  外圈「荡除蠹灾的铁骑」4 件，内圈「劫火莲灯铸炼宫」2 件；主词条攻击衣、速度鞋、攻击球、击破绳。
  副词条优先级：速度 > 击破特攻 > 攻击力百分比。

  ## 光锥
  专武「梦应归于何处」最强；五星可选「黎明恰如此燃烧」；平价用「铭记于心的约定」堆击破特攻。
  「记一位星神的陨落」的增伤对超击破无效。

  ## 配队
  超击破队：流萤 + 开拓者•同谐 + 阮•梅 + 加拉赫。详见 teams/super-break。

  ## 注意
  超击破不吃双暴与常规增伤；全队尽量 80 级。具体毕业数值以当前版本攻略页与实战为准，本卡不写死数值。
