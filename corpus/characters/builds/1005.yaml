body: |
  ## 定位
  雷属性虚无，DoT 体系的引爆器：能立即触发队友的持续伤害，4.0 加强后还能为效果命中达标的队友提供攻击力加成。
  自身 DoT 占比不高，通常作为辅C 培养。

  ## 遗器
  引爆辅C：外圈「晨昏交界的翔鹰」4 件；经典副C：外圈「幽锁深牢的系囚」4 件。
  主词条效果命中/攻击衣、速度鞋、雷伤球、充能（或攻击）绳。

  ## 光锥
  引爆辅C 用「谎言在风中飘扬」；经典副C 用「只需等待」；四星「新手任务开始前」「晚安与睡颜」。

  ## 注意
  效果命中 75% 是吃满加强加成的关键档位；速度决定引爆频率，比单纯堆攻击力更实用。
