body: |
  ## 定位
  量子记忆召唤主C：绝大部分伤害来自召唤的忆灵「死龙·玻吕刻斯」，
  召唤所需能量【新蕊】来自全队生命值变动（损失、恢复、过量治疗）。

  ## 遗器
  外圈「哀歌覆国的诗人」4 件；内圈「谧宁拾骨地」2 件。
  主词条暴伤衣、生命鞋、生命/量子球、生命绳；副词条暴击率、暴击伤害 > 生命值百分比。

  ## 光锥
  专武「让告别，更美一些」；四星「花儿不会忘记」「多流汗，少流泪」；常驻五星「记忆永不落幕」（叠影 ≤2 再考虑）。

  ## 注意
  队伍刚性需要治疗位，并尽量多带忆灵或堆生命值；队内配装也尽量堆生命。
