body: |
  ## 定位
  雷属性虚无主C，靠敌方身上的负面效果积攒充能，终结技期间无视弱点属性削韧并降低敌方全体抗性。
  探索时秘技还能直接消灭部分敌人。

  ## 遗器
  外圈「死水深潜的先驱」4 件；内圈「出云显世与高天神国」2 件。
  主词条双暴衣、攻击/速度鞋、雷伤球、攻击绳；副词条双暴 > 攻击。

  ## 光锥
  专武「行于流逝的岸」；四星用「晚安与睡颜」或「无边曼舞」。

  ## 配队
  2 魂以下更依赖虚无队友凑额外能力，中配「黄泉+椒丘+佩拉+砂金」，详见 teams/acheron-nihility。

  ## 注意
  具体伤害期望与毕业面板随版本环境变化，本卡不写死数值。
