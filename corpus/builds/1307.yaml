body: |
  ## 定位
  风属性虚无DoT主C：通过多种方式施加【奥迹】，根据层数触发额外效果，越打越痛。

  ## 遗器
  外圈「幽锁深牢的系囚」4 件（官方使用率快照最高）；内圈「泛银河商业公司」2 件。
  主词条效果命中衣、速度鞋、风伤球、攻击/充能绳；副词条效果命中 > 攻击 > 速度。

  ## 光锥
  专武「重塑时光之忆」；四星「晚安与睡颜」「延长记号」。

  ## 置信度说明
  BWIKI「黑天鹅/攻略」页为空模板。套装来自官方遗器使用率统计快照（2024-12-09），
  可能滞后于 4.7 版本；效果命中档位以当前技能说明为准。
