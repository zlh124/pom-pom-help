body: |
  ## 定位
  虚数毁灭主C：单回合可消耗多个战技点施放多种强化技能爆发，拥有独特的【逆鳞】抵扣战技点消耗。

  ## 遗器
  外圈「野穗伴行的快枪手」4 件（官方使用率快照最高）；内圈「繁星竞技场」2 件。
  主词条双暴衣、攻击/速度鞋、虚数球、攻击绳；副词条双暴 > 攻击。

  ## 光锥
  专武「比阳光更明亮的」；四星「在蓝天下」；常驻五星「记一位星神的陨落」。

  ## 置信度说明
  BWIKI「丹恒•饮月/攻略」页为空模板。套装来自官方遗器使用率统计快照（2024-12-09），
  可能滞后于 4.7 版本。配队需要能稳定提供战技点的队友。
