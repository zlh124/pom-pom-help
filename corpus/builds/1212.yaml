body: |
  ## 定位
  冰毁灭主C：进入特殊状态后强化自身攻击并行动提前，特殊状态下可施放强力技能，走一轮爆发。

  ## 遗器
  外圈「密林卧雪的猎人」4 件（官方使用率快照最高）；内圈「繁星竞技场」2 件。
  主词条暴伤/暴击衣、攻击/速度鞋、冰伤球、攻击绳；副词条双暴 > 攻击。

  ## 光锥
  专武「此身为剑」；四星「秘密誓心」；常驻五星「记一位星神的陨落」。

  ## 置信度说明
  BWIKI「镜流/攻略」页为空模板。套装来自官方遗器使用率统计快照（2024-12-09），
  可能滞后于 4.7 版本。镜流自身会消耗队友生命值，配队注意生存。
