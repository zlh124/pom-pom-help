body: |
  ## 定位
  量子同谐泛用辅助：提供全属性抗性穿透、易伤与基于自身生命值的附加伤害，
  队友施放终结技后还能追加群体攻击。

  ## 遗器
  低速流：外圈「哀歌覆国的诗人」4 件 + 内圈「谧宁拾骨地」2 件，不堆速度。
  高速流：外圈「骇域漫游的信使」或「晨昏交界的翔鹰」4 件，脚部可换速度。
  主词条双暴衣、生命鞋、量子球、充能绳；副词条暴击率 = 暴击伤害 = 生命值百分比。

  ## 光锥
  低速流毕业「如果时间是一朵花」；高速流毕业「舞！舞！舞！」；五星替代「游戏尘寰」「镜中故我」。

  ## 注意
  两套流派的遗器不能混搭；具体配速阈值随队伍行动轴变化，本卡不写死数值。
