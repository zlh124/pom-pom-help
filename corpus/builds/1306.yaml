body: |
  ## 定位
  量子同谐辅助：回复战技点并提高上限，还能让指定队友行动提前、暴击伤害提高，并提高全队造成的伤害。

  ## 遗器
  外圈「骇域漫游的信使」4 件（官方使用率快照中最高）；内圈「折断的龙骨」2 件。
  主词条暴伤衣、速度鞋、生命球、充能绳；副词条速度 > 暴击伤害 > 生命。

  ## 光锥
  专武「游戏尘寰」；四星毕业「舞！舞！舞！」。

  ## 置信度说明
  BWIKI「花火/攻略」页为空模板（施工中）。套装来自官方遗器使用率统计快照（2024-12-09），
  可能滞后于 4.7 版本；主词条/光锥为社区通用共识。欢迎带 sources 的 PR 补充当前版本依据。
