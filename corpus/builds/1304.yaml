body: |
  ## 定位
  虚数属性存护，为全队提供可叠加护盾【坚垣筹码】与效果抵抗；终结技还能提高我方对敌的暴击伤害。

  ## 遗器
  外圈「净庭教宗的圣骑士」4 件；内圈「折断的龙骨」2 件。
  主词条防御衣、速度鞋、防御球、防御/充能绳；副词条速度 > 防御。

  ## 光锥
  专武「命运从未公平」；常驻「制胜的瞬间」；四星「愿旅途永远坦然」「宇宙市场趋势」。

  ## 注意
  作为生存位需要一定速度，靠普攻为队友先手拿战技点；1 魂后充能绳价值更高。
