body: |
  ## 定位
  物理毁灭主C：施放战技或成为任意单位技能目标时积累【火种】，开大变身后队友离场，
  靠强化技能积累【毁伤】并打出强化战技「支柱·死星天裁」。

  ## 遗器
  外圈「恶海逐波的船长」4 件；内圈「妖精织梦的乐园」2 件。
  主词条暴击衣、攻击鞋、物伤球、攻击绳；副词条暴击率 > 暴击伤害 ≥ 攻击力百分比。

  ## 光锥
  专武「黎明恰如此燃烧」；五星替代「比阳光更明亮的」「记一位星神的陨落」；四星「一行往日的血」。

  ## 注意
  变身期间队友离场，「三拐一」无生存位是主流；暴击率配平要结合队友提供的暴击加成。
