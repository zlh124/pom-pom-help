core: 一个主C吃满双暴与增伤，辅助负责拉条/增伤/战技点，生存位保下限，走一轮高质量爆发。
slots:
  - name: 镜流
    role: 主C
  - name: 花火
    role: 辅助
  - name: 阮•梅
    role: 辅助
  - name: 符玄
    role: 生存
variants:
  - note: 主C可换 丹恒•饮月，把一位辅助换成知更鸟补增伤
  - note: 需要更高上限时，可把生存位换成第三位拐（高压环境不建议）
  - note: 如果主C吃战技点，花火基本是固定位
body: |
  ## 核心思路
  直伤队看的是「主C面板 × 增益覆盖 × 出手次数」。辅助的拉条、增伤、暴击伤害加成要集中覆盖在主C的输出窗口。

  ## 站位与分工
  镜流：主C，特殊状态强化技能并行动提前。
  花火：战技点+拉条+暴伤，保证主C不断循环。
  阮•梅：增伤、抗性穿透与击破效率。
  符玄：分摊伤害+全队暴击率，长线更稳。

  ## 注意
  此配队为社区通用共识（BWIKI 未给出该完整阵容），置信度 community；
  主C与辅助的搭配随版本环境变化，欢迎带 sources 的 PR 修订。
