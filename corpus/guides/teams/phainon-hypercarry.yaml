body: |
  ## 核心思路
  白厄「成为任意单位技能目标」即可获得【火种】，所以队友要选高频对队友放技能的同谐/记忆角色；
  这些角色本身也提供增伤。变身期间队友离场，生存压力大幅下降，于是「三拐一」成为主流。

  ## 站位与分工
  白厄：主C，攒【火种】开大，强化战技「支柱·死星天裁」输出。
  刻律德菈：黄金裔专属辅助，配合白厄机制。
  星期日：提供暴击/暴伤与增伤，且终结技可为白厄提供两点【火种】。
  花火：战技点与拉条，保证循环。

  ## 注意
  暴击率配平要算上队友提供的暴击加成；变身轴要练熟，否则容易空窗。
