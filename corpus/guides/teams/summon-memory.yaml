variants:
  - note: 中高配：把 长夜月 换成 开拓者•记忆，忆灵体系更完整
  - note: 替代：没有风堇时，可用罗刹/加拉赫过渡，但充能效率会下降
  - note: 高压环境注意全队生命值管理，避免为了充能翻车
body: |
  ## 核心思路
  遐蝶的【新蕊】来自全队生命值变动（损失、恢复、过量治疗），所以「治疗 + 生命值堆叠 + 忆灵」
  三者共同决定输出上限。长夜月提供副C输出与忆灵协同，缇宝提供抗穿/易伤/附伤，风堇负责高速治疗与提高生命上限。

  ## 站位与分工
  遐蝶：主C，召唤死龙打伤害。
  长夜月：副C，忆灵协同。
  缇宝：辅助，泛用增幅与追加攻击。
  风堇：生存，高速多动、忆灵消耗自身生命为全队治疗。

  ## 注意
  队内配装尽量堆生命值；治疗位是刚需，不要用纯护盾位替代。
