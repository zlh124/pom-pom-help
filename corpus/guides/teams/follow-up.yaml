body: |
  ## 核心思路
  追击队的伤害来自「追加攻击」的触发频率：主C与副C互相触发追击，知更鸟提供全队立即行动与增益，
  砂金在提供护盾的同时用追击补伤害。

  ## 站位与分工
  飞霄：主C，巡猎单体追击核心。
  托帕&账账：副C，标记目标并为追击提供增益。
  知更鸟：辅助，终结技让全队立即行动，需要先排速度轴。
  砂金：生存，护盾+效果抵抗，终结技提高暴伤。

  ## 注意
  此配队为社区通用共识（BWIKI 攻略页未直接给出该完整阵容），置信度 community；
  具体主C与副C选择随版本环境变化，欢迎带 sources 的 PR 修订。
