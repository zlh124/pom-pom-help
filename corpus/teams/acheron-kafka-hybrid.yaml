body: |
  ## 核心思路
  非 2 魂黄泉需要足够的虚无队友触发额外能力。卡芙卡既是虚无、又能持续制造 DoT 与负面效果，
  于是与黄泉组成「混伤」：卡芙卡铺 DoT，黄泉开大收爆发。

  ## 站位与分工
  黄泉：主C，主要输出窗口是终结技。
  卡芙卡：副C/引爆，提供持续伤害与负面。
  椒丘：易伤与灼烧，进一步喂黄泉充能。
  砂金：生存与负面，终结技加暴伤。

  ## 注意
  保证卡芙卡在场是本队前提；三号位优先能提供增伤/负面的虚无角色。
  该队随黄泉队友多样化已逐渐淡出主流，属于「有配置可玩」的过渡队。
