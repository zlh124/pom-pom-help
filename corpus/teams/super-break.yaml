core: 全队堆击破特攻与削韧，把敌人打进「弱点击破」窗口，再由同谐开拓者把击破转化为超击破伤害。

slots:
  - {name: 流萤, role: 主C}
  - {name: 开拓者•同谐, role: 增益}
  - {name: 阮•梅, role: 辅助}
  - {name: 加拉赫, role: 生存}

variants:
  - {note: 通用高金：把 开拓者•同谐/阮•梅/加拉赫 换成 忘归人 + 大丽花 + 灵砂，上限更高}
  - {note: 无生存位：流萤 + 开拓者•同谐 + 大丽花 + 忘归人，高压环境不建议}
  - {note: 虚构叙事等群攻场景，可把 加拉赫 换成群攻/额外削韧位}

body: |
  ## 核心思路
  超击破伤害只吃角色等级、击破特攻、削韧值、超击破/击破伤害提升，以及敌方防御/抗性/易伤；
  不吃攻击力、双暴与常规增伤。因此全队养法与直伤队完全不同：堆击破特攻、堆速度、堆削韧。

  ## 站位与分工
  流萤：主C，秘技与强化战技可给敌方加火属性弱点，负责把敌人打进击破窗口。
  开拓者•同谐：把击破转化为超击破伤害，提供击破特攻与击破效率，核心不可替代。
  阮•梅：提高击破效率与抗性穿透，兼顾行动延后。
  加拉赫：平稳削韧与回复，长线更稳。

  ## 注意
  全员尽量 80 级；遇到锁韧性或高抗性机制要换思路，不要硬打。
