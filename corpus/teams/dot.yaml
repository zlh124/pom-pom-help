body: |
  ## 核心思路
  DoT 队不是靠单次直伤，而是靠「持续伤害 × 引爆频率」。卡芙卡能立即触发队友的 DoT，
  把伤害提前兑现并增加触发次数；黑天鹅/海瑟音负责施加与叠层。

  ## 站位与分工
  黑天鹅：主 DoT 手，【奥迹】层数越高越强。
  卡芙卡：引爆辅C，速度决定引爆频率，比攻击力更重要。
  阮•梅：增伤与穿透，长线友好。
  藿藿：群体回能回血，保证循环。

  ## 注意
  卡芙卡 4.0 加强后，效果命中 ≥75% 的友方获得大量攻击力加成——全队配装要凑这个档位。
  DoT 队偏长线，短线速攻不如超击破/直伤队。
