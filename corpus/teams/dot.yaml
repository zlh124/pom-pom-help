core: DoT 手负责施加持续伤害，卡芙卡负责引爆并提高频率；全队效果命中凑 75% 档位吃满卡芙卡的加强加成。

slots:
  - {name: 黑天鹅, role: 主C}
  - {name: 卡芙卡, role: 副C}
