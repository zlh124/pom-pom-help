# 别名词典增量 v1
# 作用：把玩家黑话 / 繁简 / 错字映射到 StarRailRes 标准名，供检索与实体对齐使用。
# 规则：
#   1. canonical 必须与 StarRailRes index_min/cn/characters.json 的 name 完全一致（含「•」间隔号）。
#   2. id 优先使用 StarRailRes 角色 id；不确定或数据集未收录时留空字符串，并在 note 说明。
#   3. 歧义别名（如「火花」「冷面小青龙」）必须写 note，禁止静默合并。
